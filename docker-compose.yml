services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldcore
      POSTGRES_PASSWORD: fieldcore_dev_password
      POSTGRES_DB: fieldcore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldcore -d fieldcore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
